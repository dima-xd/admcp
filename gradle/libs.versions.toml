[versions]
coroutines = "1.11.0"
serialization = "1.12.0"
mcp = "0.16.0"
sqlite = "3.54.1.0"
junit = "5.14.3"
launcher = "1.14.3"
slf4j = "2.0.17"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
mcp-sdk = { module = "io.modelcontextprotocol:kotlin-sdk", version.ref = "mcp" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version = "2.4.21" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "launcher" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
